# A rehearsal of the deployed job, with nothing real behind it.
#
#   docker compose -f docker-compose.sim.yml up -d       start the fakes
#   ./simulate.sh                                        provision + run it
#   docker compose -f docker-compose.sim.yml down -v      throw it all away
#
# DynamoDB Local and MinIO stand in for the two AWS services. The job does not
# know: `DYNAMO_ENDPOINT_URL` and `S3_ENDPOINT_URL` are the only difference, and
# every code path -- the indexes, the sparse work queue, the presigned URLs, the
# 1 MB query page -- is the real one being exercised against a real
# implementation of the same API.
#
# What is still real in this rehearsal: the Cloud Connect call log and the
# recordings, because those are read-only and there is no fake worth writing.
# What is not: Soniox and OpenAI, replaced by STUB_PIPELINE.

services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    # In-memory rather than -dbPath: a rehearsal that remembers yesterday is not
    # a rehearsal of a cold start, and a cold start is the thing most likely to
    # be broken.
    command: -jar DynamoDBLocal.jar -inMemory -sharedDb
    ports: ["8000:8000"]

  s3:
    # quay.io, not Docker Hub: `minio/minio` there answers "pull access denied
    # ... may require docker login" for an anonymous pull, which reads as a
    # broken compose file rather than as a registry policy. MinIO publish the
    # same image here and it pulls without credentials.
    image: quay.io/minio/minio:latest
    command: server /data --address ":9000"
    environment:
      MINIO_ROOT_USER: simulated
      MINIO_ROOT_PASSWORD: simulated-secret
    ports: ["9000:9000"]
